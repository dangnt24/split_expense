<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Split Money App - JSON</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f7fb; }
    .card, .result-box { border: 0; border-radius: 16px; box-shadow: 0 4px 12px rgba(0,0,0,.06); }
    .result-box { background: white; padding: 18px; }
    h2 { font-weight: 700; }
    .btn { border-radius: 10px; }
    .table td, .table th { vertical-align: middle; }
    .table-wrap { overflow-x: auto; }
    @media (max-width: 576px) { h2 { font-size: 22px; } }
  </style>
</head>
<body class="container py-3" style="max-width: 850px">
  <h2 class="text-center mb-4">💸 Split Money App</h2>

  <div id="statusBox" class="alert d-none" role="alert"></div>

  <div id="tripBlock" class="card p-3 mb-3">
    <label class="form-label" for="tripName">Tên Trip</label>
    <input id="tripName" class="form-control mb-2" maxlength="100" placeholder="VD: Đà Lạt 2026">
    <button id="createTripBtn" class="btn btn-dark w-100" type="button">🚀 Tạo / Load Trip</button>
    <small class="text-secondary mt-2">Nhập lại đúng tên cũ để mở trip đã tạo. Không dùng tên trip dễ đoán cho thông tin nhạy cảm.</small>
  </div>

  <div class="input-group mb-3 d-none" id="share-link-group">
    <input id="shareLink" class="form-control text-center" aria-label="Link chia sẻ" readonly>
    <button id="copyLinkBtn" type="button" class="btn btn-outline-secondary">Copy</button>
  </div>

  <div id="memberBlock" class="card p-3 mb-3 d-none">
    <h5 class="mb-3">👥 Thành viên</h5>
    <div class="input-group mb-2">
      <input id="memberName" class="form-control" maxlength="80" placeholder="Nhập tên...">
      <button id="addMemberBtn" class="btn btn-primary" type="button">+</button>
    </div>
    <ul id="memberList" class="list-group"></ul>
  </div>

  <div id="expenseBlock" class="card p-3 mb-3 d-none">
    <h5 class="mb-3">💰 Thêm chi tiêu</h5>
    <select id="expenseUser" class="form-select mb-2" aria-label="Người đã trả"></select>
    <input id="category" class="form-control mb-2" maxlength="100" placeholder="Hạng mục">
    <input id="amount" type="number" min="1" step="1" class="form-control mb-2" placeholder="Số tiền (VNĐ)">
    <button id="addExpenseBtn" class="btn btn-success w-100" type="button">➕ Thêm</button>
  </div>

  <div id="result" class="result-box d-none"></div>

  <script>
    'use strict';
    const $ = id => document.getElementById(id);
    const money = n => new Intl.NumberFormat('vi-VN').format(n || 0) + '₫';
    let currentTrip = '';
    let refreshTimer = null;
    let isRefreshing = false;
    let statusTimer = null;

    function showMessage(message, kind = 'success') {
      const box = $('statusBox');
      box.textContent = message;
      box.className = `alert alert-${kind}`;
      clearTimeout(statusTimer);
      statusTimer = setTimeout(() => box.classList.add('d-none'), 4500);
    }

    async function api(action, payload = {}) {
      const isGet = action === 'get';
      const url = isGet
        ? `api.php?action=get&trip=${encodeURIComponent(currentTrip)}`
        : 'api.php';
      const response = await fetch(url, {
        method: isGet ? 'GET' : 'POST',
        headers: isGet ? {} : { 'Content-Type': 'application/json' },
        body: isGet ? undefined : JSON.stringify({ action, trip: currentTrip, ...payload }),
        cache: 'no-store'
      });
      let data;
      try { data = await response.json(); }
      catch { throw new Error('Máy chủ không trả về JSON. Hosting có hỗ trợ PHP không?'); }
      if (!response.ok || !data.ok) throw new Error(data.message || 'Có lỗi khi kết nối.');
      return data;
    }

    async function createTrip() {
      const name = $('tripName').value.trim();
      if (!name) return showMessage('Bạn chưa nhập tên trip.', 'warning');
      await openTrip(name, false);
    }

    async function openTrip(name, isGuest) {
      clearInterval(refreshTimer);
      currentTrip = name;
      try {
        await api('init_trip');
        $('tripName').value = name;
        $('tripBlock').classList.add('d-none');
        $('memberBlock').classList.toggle('d-none', isGuest);
        $('share-link-group').classList.toggle('d-none', isGuest);
        $('expenseBlock').classList.remove('d-none');
        $('result').classList.remove('d-none');
        // Chủ trip xem ?trip=, người được chia sẻ xem ?trip=...&view=guest.
        const ownUrl = new URL(location.href);
        ownUrl.searchParams.set('trip', name);
        if (isGuest) ownUrl.searchParams.set('view', 'guest');
        else ownUrl.searchParams.delete('view');
        history.replaceState(null, '', ownUrl);
        const link = new URL(location.href);
        link.searchParams.set('view', 'guest');
        $('shareLink').value = link.href;
        await refreshData();
        refreshTimer = setInterval(refreshData, 4000);
      } catch (error) {
        showMessage(error.message, 'danger');
      }
    }

    async function refreshData() {
      if (!currentTrip || isRefreshing) return;
      isRefreshing = true;
      const requestedTrip = currentTrip;
      try {
        const data = await api('get');
        if (requestedTrip !== currentTrip) return;
        renderMembers(data.members);
        renderResults(data.members, data.expenses);
      } catch (error) {
        showMessage('Không tải được dữ liệu: ' + error.message, 'danger');
      } finally {
        isRefreshing = false;
      }
    }

    async function runAction(action, payload, successMessage = 'Đã lưu.') {
      try {
        await api(action, payload);
        await refreshData();
        showMessage(successMessage);
        return true;
      } catch (error) {
        showMessage(error.message, 'danger');
        return false;
      }
    }

    function smallButton(title, color, onClick) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = `btn btn-sm btn-${color}`;
      btn.textContent = title;
      btn.addEventListener('click', onClick);
      return btn;
    }

    function renderMembers(members) {
      const list = $('memberList');
      const select = $('expenseUser');
      const previous = select.value;
      list.replaceChildren();
      select.replaceChildren();
      members.forEach(member => {
        const li = document.createElement('li');
        li.className = 'list-group-item d-flex justify-content-between align-items-center gap-2';
        const label = document.createElement('span');
        label.className = 'text-break';
        label.textContent = member.name;
        const actions = document.createElement('div');
        actions.className = 'd-flex gap-1 flex-shrink-0';
        actions.append(
          smallButton('Sửa', 'warning', () => editMember(member)),
          smallButton('Xóa', 'danger', () => deleteMember(member))
        );
        li.append(label, actions);
        list.append(li);
        const option = document.createElement('option');
        option.value = member.id;
        option.textContent = member.name;
        select.append(option);
      });
      if (members.some(m => m.id === previous)) select.value = previous;
      if (!members.length) {
        const option = document.createElement('option');
        option.textContent = 'Chưa có thành viên';
        option.value = '';
        select.append(option);
      }
      select.disabled = members.length === 0;
      $('addExpenseBtn').disabled = members.length === 0;
    }

    async function addMember() {
      const name = $('memberName').value.trim();
      if (!name) return showMessage('Bạn chưa nhập tên thành viên.', 'warning');
      if (await runAction('add_member', { name }, 'Đã thêm thành viên.')) {
        $('memberName').value = '';
      }
    }

    async function editMember(member) {
      const value = prompt('Tên mới:', member.name);
      if (value === null) return;
      const name = value.trim();
      if (!name) return showMessage('Tên thành viên không được trống.', 'warning');
      await runAction('edit_member', { id: member.id, name }, 'Đã đổi tên.');
    }

    async function deleteMember(member) {
      if (!confirm(`Xóa ${member.name} và mọi khoản chi của người này?`)) return;
      await runAction('delete_member', { id: member.id }, 'Đã xóa thành viên.');
    }

    function validAmount(value) {
      const amount = Number(value);
      if (!Number.isSafeInteger(amount) || amount < 1 || amount > 1000000000000) {
        showMessage('Số tiền phải là số nguyên dương tối đa 1.000.000.000.000₫.', 'warning');
        return null;
      }
      return amount;
    }

    async function addExpense() {
      const memberId = $('expenseUser').value;
      const category = $('category').value.trim();
      const amount = validAmount($('amount').value);
      if (!memberId || amount === null) return;
      if (await runAction('add_expense', { memberId, category, amount }, 'Đã thêm khoản chi.')) {
        $('category').value = '';
        $('amount').value = '';
      }
    }

    async function editExpense(expense) {
      const password = prompt('Nhập mật khẩu sửa khoản chi:');
      if (password === null) return;
      const raw = prompt('Số tiền mới:', String(expense.amount));
      if (raw === null) return;
      const amount = validAmount(raw);
      if (amount === null) return;
      await runAction('edit_expense', { id: expense.id, amount, password }, 'Đã sửa khoản chi.');
    }

    async function deleteExpense(expense) {
      const password = prompt('Nhập mật khẩu xóa khoản chi:');
      if (password === null) return;
      if (!confirm('Xóa khoản chi này?')) return;
      await runAction('delete_expense', { id: expense.id, password }, 'Đã xóa khoản chi.');
    }

    function line(text, tag = 'p') {
      const el = document.createElement(tag);
      el.textContent = text;
      return el;
    }

    function renderResults(members, expenses) {
      const result = $('result');
      const paid = Object.fromEntries(members.map(m => [m.id, 0]));
      const names = Object.fromEntries(members.map(m => [m.id, m.name]));
      let total = 0;
      expenses.forEach(e => {
        total += e.amount;
        paid[e.memberId] = (paid[e.memberId] || 0) + e.amount;
      });
      const avg = members.length ? total / members.length : 0;
      const header = line('Tổng: ' + money(total), 'h5');
      const perPerson = line('Mỗi người: ' + money(Math.round(avg)) + (total % (members.length || 1) ? ' (làm tròn đến 1₫)' : ''));
      const title = line('📄 Chi tiết', 'h6');
      const wrapper = document.createElement('div');
      wrapper.className = 'table-wrap mb-3';
      const table = document.createElement('table');
      table.className = 'table table-sm table-striped';
      table.innerHTML = '<thead><tr><th>Người</th><th>Hạng mục</th><th>Tiền</th><th></th></tr></thead>';
      const tbody = document.createElement('tbody');
      [...expenses].reverse().forEach(e => {
        const tr = document.createElement('tr');
        [names[e.memberId] || '(đã xóa)', e.category || '', money(e.amount)].forEach(value => {
          const td = document.createElement('td');
          td.textContent = value;
          tr.append(td);
        });
        const buttons = document.createElement('td');
        const actions = document.createElement('div');
        actions.className = 'd-flex gap-1';
        actions.append(
          smallButton('Sửa', 'warning', () => editExpense(e)),
          smallButton('Xóa', 'danger', () => deleteExpense(e))
        );
        buttons.append(actions);
        tr.append(buttons);
        tbody.append(tr);
      });
      if (!expenses.length) {
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.colSpan = 4;
        td.className = 'text-secondary';
        td.textContent = 'Chưa có khoản chi nào.';
        tr.append(td);
        tbody.append(tr);
      }
      table.append(tbody);
      wrapper.append(table);

      const settleTitle = line('🔄 Ai trả ai', 'h6');
      const transfers = document.createElement('div');
      if (members.length) {
        // Chia phần dư (nếu có) mỗi người +1₫ để tổng phải trả vẫn đúng tuyệt đối.
        const base = Math.floor(total / members.length);
        const extra = total % members.length;
        const creditors = [];
        const debtors = [];
        members.forEach((m, index) => {
          const target = base + (index < extra ? 1 : 0);
          const balance = paid[m.id] - target;
          if (balance > 0) creditors.push({ name: m.name, amount: balance });
          if (balance < 0) debtors.push({ name: m.name, amount: -balance });
        });
        let i = 0;
        let j = 0;
        while (i < debtors.length && j < creditors.length) {
          const value = Math.min(debtors[i].amount, creditors[j].amount);
          const p = document.createElement('p');
          p.className = 'mb-1';
          p.append(document.createTextNode(`${debtors[i].name} trả ${creditors[j].name}: `));
          const strong = document.createElement('strong');
          strong.textContent = money(value);
          p.append(strong);
          transfers.append(p);
          debtors[i].amount -= value;
          creditors[j].amount -= value;
          if (!debtors[i].amount) i++;
          if (!creditors[j].amount) j++;
        }
      }
      if (!transfers.childNodes.length) transfers.append(line('Đã cân bằng 👍'));
      result.replaceChildren(header, perPerson, title, wrapper, settleTitle, transfers);
    }

    async function copyLink() {
      const text = $('shareLink').value;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          $('shareLink').select();
          if (!document.execCommand('copy')) throw new Error('Copy thất bại.');
        }
        showMessage('Đã copy link 👍');
      } catch {
        showMessage('Không tự copy được. Bạn hãy chọn và sao chép link.', 'warning');
      }
    }

    $('createTripBtn').addEventListener('click', createTrip);
    $('addMemberBtn').addEventListener('click', addMember);
    $('addExpenseBtn').addEventListener('click', addExpense);
    $('copyLinkBtn').addEventListener('click', copyLink);
    $('tripName').addEventListener('keydown', e => { if (e.key === 'Enter') createTrip(); });
    $('memberName').addEventListener('keydown', e => { if (e.key === 'Enter') addMember(); });
    $('amount').addEventListener('keydown', e => { if (e.key === 'Enter') addExpense(); });

    const params = new URLSearchParams(location.search);
    const trip = params.get('trip');
    if (trip) openTrip(trip, params.get('view') === 'guest');
  </script>
</body>
</html>
