<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Split Money — Chia tiền nhóm</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#f5f7fb;color:#1e293b}.card{border:0;border-radius:17px;box-shadow:0 3px 14px #152d4810}.btn{border-radius:10px}.money{font-variant-numeric:tabular-nums}.muted{color:#64748b}.table-responsive{overflow-x:auto} .status{min-height:24px} .tiny{font-size:.84rem}
</style>
</head>
<body><main class="container py-4" style="max-width:870px">
<h2 class="text-center fw-bold mb-1">💸 Split Money</h2><p class="text-center muted mb-4">Chia tiền chuyến đi • đồng bộ theo thời gian thực</p>
<div id="status" class="alert alert-info status" role="status">Đang kết nối Firebase…</div>
<section class="card p-3 mb-3" id="createBlock"><label for="tripName" class="form-label fw-semibold">Tên chuyến đi</label><div class="input-group"><input id="tripName" class="form-control" maxlength="80" placeholder="Ví dụ: Đà Lạt 2026"><button id="createBtn" class="btn btn-dark">🚀 Tạo trip</button></div></section>
<section class="card p-3 mb-3 d-none" id="tripBlock"><div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2"><h5 class="m-0" id="tripTitle"></h5><button id="newTripBtn" class="btn btn-outline-secondary btn-sm">Trip mới</button></div><label class="form-label tiny">Link chia sẻ (người có link có thể xem và thêm chi tiêu)</label><div class="input-group"><input id="shareLink" class="form-control" readonly><button id="copyBtn" class="btn btn-outline-primary">Copy</button></div></section>
<section class="card p-3 mb-3 d-none" id="memberBlock"><h5>👥 Thành viên</h5><div class="input-group mb-2"><input id="memberName" class="form-control" maxlength="80" placeholder="Nhập tên thành viên"><button id="addMemberBtn" class="btn btn-primary">Thêm</button></div><ul id="memberList" class="list-group list-group-flush"></ul></section>
<section class="card p-3 mb-3 d-none" id="expenseBlock"><h5>💰 Thêm chi tiêu</h5><label class="form-label">Ai đã trả?</label><select id="expenseUser" class="form-select mb-2"></select><input id="category" class="form-control mb-2" maxlength="120" placeholder="Hạng mục (ăn uống, taxi...)"><input id="amount" type="number" min="1" max="1000000000000" step="1" class="form-control mb-2" placeholder="Số tiền (VND)"><button id="addExpenseBtn" class="btn btn-success w-100">➕ Thêm chi tiêu</button></section>
<section class="card p-3 d-none" id="resultBlock"><h5 class="fw-bold">📊 Tổng kết</h5><p id="summary" class="mb-3"></p><h6>📄 Chi tiết</h6><div class="table-responsive"><table class="table table-sm align-middle"><thead><tr><th>Người trả</th><th>Hạng mục</th><th class="text-end">Tiền</th><th></th></tr></thead><tbody id="expenseList"></tbody></table></div><h6 class="mt-3">🔄 Ai trả ai</h6><div id="settlement"></div></section>
<p class="text-center muted tiny mt-3">Dữ liệu lưu trên Firebase Firestore, không nằm trong repository GitHub.</p>
</main>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
'use strict';
// Firebase Web App configuration. Replace if using a different Firebase project.
const firebaseConfig = {
  apiKey: 'AIzaSyCF4fY5OVOpD52uhkY4bXnaa426EfQsMCE',
  authDomain: 'split-money-app-c6ac2.firebaseapp.com',
  projectId: 'split-money-app-c6ac2'
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const el = id => document.getElementById(id);
const money = n => Math.round(n).toLocaleString('vi-VN') + '₫';
const docText = (tag, value, klass) => { const x = document.createElement(tag); x.textContent = value; if(klass) x.className=klass; return x; };
let tripId = null, members = [], expenses = [], unsubs = [], currentUser = null;
function status(message, type='info'){ el('status').className='alert alert-'+type; el('status').textContent=message; }
function failed(e){ console.error(e); status('Có lỗi: '+(e.message || String(e)), 'danger'); }
function toggleTrip(on){ ['tripBlock','memberBlock','expenseBlock','resultBlock'].forEach(id=>el(id).classList.toggle('d-none',!on)); el('createBlock').classList.toggle('d-none',on); }
function stopListening(){unsubs.forEach(u=>u());unsubs=[];}
function shareUrl(id){const u=new URL(location.href);u.searchParams.set('trip',id);return u.toString();}
async function openTrip(id){
 stopListening(); tripId=id; members=[]; expenses=[]; toggleTrip(true);
 const doc=await db.collection('trips').doc(id).get();
 if(!doc.exists) {stopListening();tripId=null;toggleTrip(false);status('Không tìm thấy trip. Kiểm tra lại link.', 'warning');return;}
 el('tripTitle').textContent='🧳 '+doc.data().name;
 el('shareLink').value=shareUrl(id);history.replaceState(null,'',shareUrl(id));
 unsubs.push(db.collection('trips').doc(id).collection('members').onSnapshot(s=>{
   members=s.docs.map(d=>({id:d.id,...d.data()}));renderMembers();renderAll();
 },failed));
 unsubs.push(db.collection('trips').doc(id).collection('expenses').onSnapshot(s=>{
   expenses=s.docs.map(d=>({id:d.id,...d.data()}));renderAll();
 },failed));
 status('Đã kết nối! Dữ liệu tự đồng bộ với mọi người có link.', 'success');
}
async function createTrip(){
 const name=el('tripName').value.trim();if(!name)return status('Nhập tên trip trước nhé.', 'warning');
 try{ const ref=db.collection('trips').doc();await ref.set({name,createdBy:currentUser.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()});await openTrip(ref.id); }
 catch(e){failed(e);}
}
async function addMember(){
 const name=el('memberName').value.trim();if(!tripId||!name)return;
 if(members.some(m=>m.name.toLocaleLowerCase('vi')===name.toLocaleLowerCase('vi')))return status('Tên thành viên đã tồn tại.', 'warning');
 try{await db.collection('trips').doc(tripId).collection('members').add({name});el('memberName').value='';}catch(e){failed(e);}
}
function renderMembers(){
 const list=el('memberList'), select=el('expenseUser'), previous=select.value;
 list.replaceChildren();select.replaceChildren();
 members.forEach(m=>{
  const li=docText('li',m.name,'list-group-item');list.appendChild(li);
  const opt=document.createElement('option');opt.value=m.id;opt.textContent=m.name;select.appendChild(opt);
 });
 if(members.some(m=>m.id===previous))select.value=previous;
}
async function addExpense(){
 const memberId=el('expenseUser').value, category=el('category').value.trim();
 const amount=Number(el('amount').value);
 if(!tripId||!members.some(m=>m.id===memberId)||!Number.isSafeInteger(amount)||amount<=0||amount>1e12) return status('Chọn thành viên và nhập số tiền nguyên hợp lệ.', 'warning');
 try{
  await db.collection('trips').doc(tripId).collection('expenses').add({memberId,category,amount,createdBy:currentUser.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
  el('category').value='';el('amount').value=''; status('Đã thêm khoản chi!', 'success');
 }catch(e){failed(e);}
}
async function editExpense(x){
 const str=prompt('Số tiền mới (VND):',String(x.amount));if(str===null)return;
 const amount=Number(str);if(!Number.isSafeInteger(amount)||amount<=0||amount>1e12)return status('Số tiền phải là số nguyên dương.', 'warning');
 try{await db.collection('trips').doc(tripId).collection('expenses').doc(x.id).update({amount});}catch(e){failed(e);}
}
async function deleteExpense(x){
 if(!confirm('Xóa khoản chi này?'))return;
 try{await db.collection('trips').doc(tripId).collection('expenses').doc(x.id).delete();}catch(e){failed(e);}
}
function renderAll(){
 const names=new Map(members.map(m=>[m.id,m.name]));
 const total=expenses.reduce((a,x)=>a+(Number(x.amount)||0),0);
 const count=members.length, avg=count?total/count:0;
 el('summary').textContent=`Tổng: ${money(total)}  •  Mỗi người: ${money(avg)}  •  ${count} thành viên`;
 const tbody=el('expenseList');tbody.replaceChildren();
 expenses.forEach(x=>{
  const tr=document.createElement('tr');
  tr.append(docText('td',names.get(x.memberId)||'(đã rời nhóm)'),docText('td',x.category||'—'),docText('td',money(x.amount),'text-end money'));
  const td=document.createElement('td');td.className='text-end text-nowrap';
  if(x.createdBy===currentUser?.uid){
    const edit=docText('button','Sửa','btn btn-sm btn-outline-warning me-1');edit.onclick=()=>editExpense(x);
    const del=docText('button','Xóa','btn btn-sm btn-outline-danger');del.onclick=()=>deleteExpense(x);td.append(edit,del);
  }tr.appendChild(td);tbody.appendChild(tr);
 });
 if(!expenses.length){const tr=docText('tr','');const td=docText('td','Chưa có khoản chi nào.','muted');td.colSpan=4;tr.appendChild(td);tbody.appendChild(tr);}
 const balances=members.map(m=>({name:m.name,amount:(expenses.filter(x=>x.memberId===m.id).reduce((a,x)=>a+x.amount,0))-avg}));
 const debtors=balances.filter(x=>x.amount< -0.01).map(x=>({...x,amount:-x.amount}));
 const creditors=balances.filter(x=>x.amount>0.01).map(x=>({...x}));
 const out=el('settlement');out.replaceChildren();
 let i=0,j=0;while(i<debtors.length && j<creditors.length){
  const n=Math.min(debtors[i].amount,creditors[j].amount); const p=document.createElement('p');p.className='mb-2';
  p.append(docText('span',`${debtors[i].name} trả ${creditors[j].name}: `),docText('strong',money(n)));out.appendChild(p);
  debtors[i].amount-=n;creditors[j].amount-=n;if(debtors[i].amount<0.01)i++;if(creditors[j].amount<0.01)j++;
 }
 if(!out.childNodes.length)out.textContent='Đã cân bằng 👍';
}
el('createBtn').onclick=createTrip;el('addMemberBtn').onclick=addMember;el('addExpenseBtn').onclick=addExpense;
el('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(el('shareLink').value);status('Đã copy link!', 'success');}catch(e){el('shareLink').select();status('Hãy copy link trong ô bên trên.', 'warning');}};
el('newTripBtn').onclick=()=>{stopListening();tripId=null;history.replaceState(null,'',location.pathname);toggleTrip(false);status('Nhập tên để tạo trip mới.','info');};
el('tripName').addEventListener('keydown',e=>{if(e.key==='Enter')createTrip();});
el('memberName').addEventListener('keydown',e=>{if(e.key==='Enter')addMember();});
el('amount').addEventListener('keydown',e=>{if(e.key==='Enter')addExpense();});
auth.onAuthStateChanged(async user=>{
 try{
 if(!user){await auth.signInAnonymously();return;}
 currentUser=user;
 const id=new URLSearchParams(location.search).get('trip');
 if(id){if(!/^[a-zA-Z0-9]{20}$/.test(id))return status('Mã trip không hợp lệ.', 'danger');await openTrip(id);}
 else status('Sẵn sàng! Hãy tạo trip đầu tiên.', 'success');
 }catch(e){failed(e);}
});
</script></body></html>
